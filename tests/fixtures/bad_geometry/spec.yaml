seqspec_version: 0.4.0
assay_id: bad-geometry
name: Bad Geometry Fixture
doi: https://doi.org/10.0000/bad-geometry
date: 2026-03-19
description: Fixture that intentionally duplicates barcode and UMI assignments across reads
modalities:
  - rna
lib_struct: ""
sequence_spec:
  - read_id: bad_R1
    name: Bad Read 1
    modality: rna
    primer_id: primer1
    min_len: 6
    max_len: 6
    strand: pos
    files:
      - file_id: bad_R1.fastq
        filename: bad_R1.fastq
        filetype: fastq
        filesize: 0
        url: fastqs/bad_R1.fastq
        urltype: local
        md5: ""
  - read_id: bad_R2
    name: Bad Read 2
    modality: rna
    primer_id: primer2
    min_len: 14
    max_len: 14
    strand: neg
    files:
      - file_id: bad_R2.fastq
        filename: bad_R2.fastq
        filetype: fastq
        filesize: 0
        url: fastqs/bad_R2.fastq
        urltype: local
        md5: ""
library_spec:
