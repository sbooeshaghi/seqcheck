        sequence_type: fixed
        sequence: CCCC
        min_len: 4
        max_len: 4
        onlist: null
        regions: []
      - region_id: feature
        region_type: sgrna_target
        name: Feature
        sequence_type: random
        sequence: XXXX
        min_len: 4
        max_len: 4
        onlist: null
        regions: []
      - region_id: primer2
