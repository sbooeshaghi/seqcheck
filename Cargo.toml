[package]
name = "seqcheck"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Empirical FASTQ checks against seqspec files"
repository = "https://github.com/sbooeshaghi/seqcheck"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = "1"
kseq = "0.5.1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
seqspec = { path = "../seqspec" }
toml = "0.8"
